[project]
name = "idea-bot"
version = "0.1.0"
description = "Telegram-бот: идеи в Obsidian с разбором через Claude"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
